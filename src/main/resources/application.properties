spring.application.name=sparkz

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${SUPABASE_BD_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Match APIs fail closed until a Supabase issuer and supported schools are configured.
sparkz.auth.issuer=${SUPABASE_AUTH_ISSUER:}
sparkz.auth.audience=authenticated
sparkz.matching.supported-schools=${SPARKZ_SUPPORTED_SCHOOLS:}
spring.mvc.problemdetails.enabled=true
