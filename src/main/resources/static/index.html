<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>Discover people · Sparkz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="/sparkz-layout.css">
  <script src="/sparkz-layout.js" defer></script>
</head>
<body class="sparkz-page" data-page="discover">
  <div data-sparkz-header></div>
  <main class="sparkz-discover">
    <section class="sparkz-discover-intro" aria-labelledby="discover-title">
      <h1 id="discover-title">Find your people.</h1>
      <p class="sparkz-script-line">Share your spark.</p>
      <p class="sparkz-tagline">Trade what you know for something you’d love to learn.</p>
    </section>

    <form class="sparkz-filter-bar" aria-label="Filter people">
      <label class="sparkz-filter-field">Skill
        <select name="skill"><option>Any skill</option><option>Java</option><option>Writing</option><option>Photography</option></select>
      </label>
      <label class="sparkz-filter-field">They want to
        <select name="skillType"><option>Teach or learn</option><option>Teach</option><option>Learn</option></select>
      </label>
      <label class="sparkz-filter-field">Available day
        <select name="day"><option>Any day</option><option>Weekdays</option><option>Weekends</option></select>
      </label>
      <label class="sparkz-filter-field">Show
        <select name="view"><option>Skill matches</option><option>All students</option></select>
      </label>
      <div class="sparkz-filter-action"><button type="button" class="sparkz-find-button">Find people <span aria-hidden="true">→</span></button></div>
    </form>

    <section class="sparkz-results" aria-label="People results" aria-live="polite">
      <p class="sparkz-results-message">People who match your filters will appear here.</p>
      <nav class="sparkz-pagination" aria-label="People pages">
        <button type="button" disabled>Previous</button>
        <button type="button" disabled>Next</button>
      </nav>
    </section>
  </main>
  <div data-sparkz-footer></div>
</body>
</html>
